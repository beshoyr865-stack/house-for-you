<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House for you – شقق وبيوت للبيع والإيجار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1b2430;--muted:#6b7686;--brand:#b8892b;--brand2:#8f6a1f;--line:#d9dfe7;--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--text:#e8edf3;--muted:#98a3b3;--brand:#e0b24a;--brand2:#c99a2e;--line:#2a3441}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--text:#e8edf3;--muted:#98a3b3;--brand:#e0b24a;--brand2:#c99a2e;--line:#2a3441}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7}
header{background:#1a1a1a;color:#f3e3b5;padding:16px 20px 56px;text-align:center}
header img{width:100%;max-width:300px;height:auto;display:block;margin:0 auto 6px}
header h1{margin:0 0 8px;font-size:1.7rem;font-weight:800}
header p{margin:0;opacity:.92}
main{max-width:640px;margin:-34px auto 90px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg input{display:none}
.seg label{margin:0;text-align:center;padding:11px 4px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--brand);color:#1a1a1a;border-color:var(--brand)}
button.send{margin-top:20px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--wa);color:#08301a;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.err{color:#dc2626;font-size:.9rem;margin-top:10px;min-height:1.2em}
.note{color:var(--muted);font-size:.85rem;text-align:center;margin-top:12px}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;background:var(--wa);color:#08301a;border-radius:999px;padding:12px 18px;font-weight:800;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
</head>

<main>
  <div class="card">
    <div class="seg">
      <input type="radio" name="deal" id="d1" value="شراء" checked><label for="d1">شراء</label>
      <input type="radio" name="deal" id="d2" value="إيجار"><label for="d2">إيجار</label>

    <label for="name">الاسم *</label>
    <input id="name" placeholder="اكتب اسمك" autocomplete="name">

    <label for="phone">رقم التليفون *</label>

    <label for="type">نوع العقار</label>

      <option>شقة</option><option>بيت / فيلا</option><option>دور في بيت</option>
