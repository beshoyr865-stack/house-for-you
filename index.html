<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اطلب وحدتك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef3f4;--surface:#fff;--ink:#10283c;--muted:#5b6f7d;--line:#d6e0e4;--brand:#0d6e6e;--brand-ink:#fff;--gold:#b7791f;--tint:#dcebea;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a24;--surface:#142634;--ink:#e8f0f3;--muted:#98acb8;--line:#27404f;--brand:#3fb5ab;--brand-ink:#06201f;--gold:#e0ad55;--tint:#173a40;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a24;--surface:#142634;--ink:#e8f0f3;--muted:#98acb8;--line:#27404f;--brand:#3fb5ab;--brand-ink:#06201f;--gold:#e0ad55;--tint:#173a40;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:620px;margin:0 auto;padding:26px 18px 50px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:22px}
.brand i{width:28px;height:28px;border-radius:8px 8px 8px 0;background:var(--gold);display:inline-block}
h1{font-size:clamp(26px,6vw,36px);line-height:1.3;margin:0 0 8px}
.lead{margin:0 0 22px;color:var(--muted)}
form,.done{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
fieldset{border:0;margin:0 0 16px;padding:0}
legend,label{font-weight:500;display:block;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{margin:0;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.seg input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.f{margin-bottom:16px}.row .f{margin:0}
input[type=text],input[type=tel],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--err);font-size:14px;min-height:20px;margin-top:4px}
.btn{width:100%;background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;display:block;text-align:center}
.btn.alt{background:var(--tint);color:var(--ink);margin-top:10px}
.note{color:var(--muted);font-size:14px;margin:12px 0 0;text-align:center}
.done[hidden],form[hidden]{display:none}
.done h2{margin:0 0 6px}
.sum{background:var(--bg);border-radius:10px;padding:12px 14px;margin:14px 0;white-space:pre-line;font-size:15px}
@media (max-width:480px){.row{grid-template-columns:1fr;gap:16px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><i></i><span>بيتك للعقارات</span></div>
  <h1>قولنا إنت محتاج إيه</h1>
  <p class="lead">سيب طلبك ورقمك، وأحد الاستشاريين هيتواصل معاك بأنسب الوحدات.</p>

  <form id="f" novalidate>
    <fieldset>
      <legend>نوع الطلب</legend>
      <div class="seg">
        <label><input type="radio" name="kind" value="شراء (تمليك)" checked><span>شراء (تمليك)</span></label>
        <label><input type="radio" name="kind" value="إيجار"><span>إيجار</span></label>
        <label><input type="radio" name="kind" value="عرض وحدتي للبيع"><span>عندي وحدة للبيع</span></label>
        <label><input type="radio" name="kind" value="عرض وحدتي للإيجار"><span>عندي وحدة للإيجار</span></label>
      </div>
    </fieldset>

    <div class="row">
      <div><label for="type">نوع الوحدة</label>
        <select id="type"><option>شقة</option><option>فيلا</option><option>دوبلكس</option><option>شاليه</option><option>محل / مكتب</option><option>أرض</option></select></div>
      <div><label for="beds">عدد الغرف</label>
        <select id="beds"><option value="">غير محدد</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select></div>
    </div>

    <div class="row">
      <div><label for="area">المدينة / المنطقة</label><input id="area" type="text" placeholder="مثال: المنصورة، التجمع"></div>
      <div><label for="budget" id="bl">الميزانية (جنيه)</label><input id="budget" type="text" inputmode="numeric" placeholder="مثال: 3000000"></div>
    </div>

    <div class="f"><label for="name">الاسم</label><input id="name" type="text" autocomplete="name" required></div>
    <div class="f"><label for="phone">رقم الموبايل</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required><div class="err" id="perr" role="alert"></div></div>
    <div class="f"><label for="notes">تفاصيل إضافية (اختياري)</label><textarea id="notes" placeholder="الدور، التشطيب، طريقة الدفع، موعد الاستلام…"></textarea></div>

    <button class="btn" type="submit">إرسال الطلب</button>
    <p class="note">هيتفتح واتساب برسالة جاهزة بطلبك، اضغط إرسال وخلاص.</p>
  </form>

  <section class="done" id="done" hidden aria-live="polite">
    <h2>طلبك جاهز للإرسال</h2>
    <p>لو واتساب ماتفتحش تلقائيًا، اضغط الزرار تحت لإرسال الطلب.</p>
    <div class="sum" id="sum"></div>
    <a class="btn" id="wa" target="_blank" rel="noopener">أرسل على واتساب</a>
    <button class="btn alt" id="again" type="button">طلب جديد</button>
  </section>
</main>

<script>
var PHONE="201271289862"; // رقم الواتساب بالصيغة الدولية بدون +
var $=function(i){return document.getElementById(i)};
function digits(s){return s.replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)})}
function kind(){return document.querySelector('input[name=kind]:checked').value}
function sync(){var own=kind().indexOf("عرض")===0,rent=kind().indexOf("إيجار")>-1;
 $("bl").textContent=own?(rent?"الإيجار المطلوب (جنيه/شهر)":"السعر المطلوب (جنيه)"):(rent?"الميزانية (جنيه/شهر)":"الميزانية (جنيه)")}
document.querySelectorAll('input[name=kind]').forEach(function(r){r.addEventListener("change",sync)});

$("f").addEventListener("submit",function(e){
 e.preventDefault();
 var ph=digits($("phone").value).replace(/[\s\-+]/g,"").replace(/^0020/,"0").replace(/^20(?=1)/,"0");
 var name=$("name").value.trim();
 if(!name){$("perr").textContent="اكتب اسمك الأول.";$("name").focus();return}
 if(!/^01[0125][0-9]{8}$/.test(ph)){$("perr").textContent="اكتب رقم موبايل مصري صحيح من 11 رقم، يبدأ بـ 01.";$("phone").focus();return}
 $("perr").textContent="";
 var L=["نوع الطلب: "+kind(),"نوع الوحدة: "+$("type").value];
 if($("beds").value)L.push("عدد الغرف: "+$("beds").value);
 if($("area").value.trim())L.push("المنطقة: "+$("area").value.trim());
 if($("budget").value.trim())L.push($("bl").textContent.replace(/ \(.*/,"")+": "+digits($("budget").value.trim()));
 if($("notes").value.trim())L.push("تفاصيل: "+$("notes").value.trim());
 L.push("الاسم: "+name,"الموبايل: "+ph);
 var text="طلب جديد من صفحة العقارات\n"+L.join("\n");
 var url="https://wa.me/"+PHONE+"?text="+encodeURIComponent(text);
 $("sum").textContent=L.join("\n");
 $("wa").href=url;
 $("f").hidden=true;$("done").hidden=false;$("done").scrollIntoView();
 window.open(url,"_blank","noopener");
});
$("again").onclick=function(){$("f").reset();sync();$("done").hidden=true;$("f").hidden=false;window.scrollTo(0,0)};
sync();
</script>
</body>
</html>
