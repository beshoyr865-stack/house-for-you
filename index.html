
<!DOCTYPE html>
  <p style="margin-top:6px;font-weight:600;color:#e0b24a">سيتم الرد عليك من المهندس بيشوي 👷‍♂️</p>
</header>
<main>
  <div class="card">
    <div class="seg">
      <input type="radio" name="deal" id="d1" value="شراء" checked><label for="d1">شراء</label>
      <input type="radio" name="deal" id="d2" value="إيجار"><label for="d2">إيجار</label>
      <input type="radio" name="deal" id="d3" value="بيع / تأجير عقاري"><label for="d3">عندي عقار</label>
    </div>

    <label for="name">الاسم *</label>
    <input id="name" placeholder="اكتب اسمك" autocomplete="name">

    <label for="phone">رقم التليفون *</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="01xxxxxxxxx" autocomplete="tel">

    <label for="type">نوع العقار</label>
    <select id="type">
      <option>شقة</option><option>بيت / فيلا</option><option>دور في بيت</option>
      <option>أرض</option><option>محل</option><option>مكتب</option>
    </select>

    <label for="area">المنطقة / المدينة *</label>
    <input id="area" placeholder="مثال: المنصورة – حي الجامعة">

    <div class="row">
      <div><label for="rooms">عدد الغرف</label>
        <select id="rooms"><option>غير محدد</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select></div>
      <div><label for="budget">الميزانية (جنيه)</label>
        <input id="budget" inputmode="numeric" placeholder="مثال: 1,500,000"></div>
    </div>

    <label for="details">تفاصيل إضافية</label>
    <textarea id="details" rows="3" placeholder="الدور، المساحة، تشطيب، قريب من…"></textarea>

    <div class="err" id="err"></div>
    <button class="send" id="send">إرسال الطلب على واتساب 💬</button>
    <p class="note">هيفتح معاك واتساب برسالة جاهزة بطلبك، اضغط إرسال وسيتم الرد عليك من المهندس بيشوي في أسرع وقت.</p>
  </div>
</main>
<a class="fab" href="https://wa.me/201271289862" target="_blank" rel="noopener">💬 كلمنا واتساب</a>

<script>
(function(){
  var NUM='201271289862';
  var $=function(id){return document.getElementById(id)};
  $('send').addEventListener('click',function(){
    var name=$('name').value.trim(), phone=$('phone').value.trim(), area=$('area').value.trim();
    var err=$('err');
    if(!name||!phone||!area){err.textContent='من فضلك املأ الاسم ورقم التليفون والمنطقة.';return}
    if(!/^[0-9+\s-]{9,15}$/.test(phone)){err.textContent='رقم التليفون غير صحيح.';return}
    err.textContent='';
    var deal=document.querySelector('input[name="deal"]:checked').value;
    var lines=[
      '*طلب عقار جديد – House for you* 🏠',
      'نوع الطلب: '+deal,
      'الاسم: '+name,
      'التليفون: '+phone,
      'نوع العقار: '+$('type').value,
      'المنطقة: '+area,
      'عدد الغرف: '+$('rooms').value,
      'الميزانية: '+($('budget').value.trim()||'غير محددة'),
      'تفاصيل: '+($('details').value.trim()||'—')
    ];
    var a=document.createElement('a');a.href='https://wa.me/'+NUM+'?text='+encodeURIComponent(lines.join('\n'));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  });
})();
</script>
</body>
</html>
